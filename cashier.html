<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>كاشير — زمزم ديزيرت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #07050f;
  --surface:   #0f0c1a;
  --surface2:  #161228;
  --border:    rgba(255,255,255,.07);
  --border-hi: rgba(255,255,255,.15);
  --gold:      #f5c842;
  --gold-dim:  rgba(245,200,66,.15);
  --red:       #ef4444;
  --green:     #22c55e;
  --blue:      #3b82f6;
  --text:      #fff;
  --text-dim:  rgba(255,255,255,.45);
  --text-faint:rgba(255,255,255,.2);
  --radius:    14px;
  --topbar-h:  58px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;overflow-x:hidden}

/* ══ TOPBAR ══ */
.topbar{
  position:fixed;top:0;right:0;left:0;z-index:100;height:var(--topbar-h);
  background:rgba(7,5,15,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;
}
.tb-brand{display:flex;align-items:center;gap:8px}
.tb-logo{font-weight:900;font-size:15px;letter-spacing:.2em;color:var(--gold)}
.tb-logo span{color:rgba(255,255,255,.5);font-size:10px;letter-spacing:.3em;display:block;font-weight:600}
.tb-cashier{font-size:12px;color:var(--text-dim);background:rgba(255,255,255,.05);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.tb-cashier strong{color:var(--text);font-weight:700}
.tb-actions{display:flex;align-items:center;gap:8px}
.tb-sound-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text-dim);
  font-size:18px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.tb-sound-btn.on{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:var(--green)}
.tb-logout{
  padding:7px 14px;border-radius:10px;border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.08);color:#fca5a5;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;
}
.tb-logout:hover{background:rgba(239,68,68,.18);color:#fff}

/* ══ MAIN ══ */
.main{padding-top:calc(var(--topbar-h) + 16px);padding-bottom:24px;min-height:100vh}

/* ══ STATS BAR ══ */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  padding:0 14px 14px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;text-align:center;
}
.stat-val{font-size:1.5rem;font-weight:900;line-height:1.1}
.stat-lbl{font-size:10px;color:var(--text-dim);margin-top:3px;font-weight:600;letter-spacing:.03em}
.stat-card.gold .stat-val{color:var(--gold)}
.stat-card.green .stat-val{color:var(--green)}
.stat-card.blue  .stat-val{color:var(--blue)}
.stat-card.red   .stat-val{color:var(--red)}

/* ══ FILTERS ══ */
.filters{
  display:flex;gap:8px;padding:0 14px 14px;overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  padding:7px 16px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--text-dim);font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap;transition:all .2s;flex-shrink:0;
}
.filter-btn.active{
  background:var(--gold-dim);border-color:rgba(245,200,66,.4);color:var(--gold);
}

/* ══ SEARCH ══ */
.search-wrap{padding:0 14px 14px}
.search-input{
  width:100%;padding:11px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:13px;font-family:'Cairo',sans-serif;
  outline:none;transition:border-color .2s;
}
.search-input:focus{border-color:rgba(245,200,66,.4)}
.search-input::placeholder{color:var(--text-faint)}

/* ══ ORDERS GRID ══ */
.orders-wrap{padding:0 14px}
.orders-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.orders-title{font-weight:900;font-size:15px}
.orders-count{
  font-size:12px;color:var(--text-dim);
  background:rgba(255,255,255,.05);padding:3px 10px;border-radius:20px;
}
.orders-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px;
}

/* ══ ORDER CARD ══ */
.order-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;position:relative;overflow:hidden;
  transition:border-color .3s,box-shadow .3s;
  animation:slideInCard .3s ease;
}
@keyframes slideInCard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.order-card.new-order{
  border-color:rgba(245,200,66,.5);
  box-shadow:0 0 20px rgba(245,200,66,.12);
  animation:slideInCard .3s ease, newPulse 2s ease 3;
}
@keyframes newPulse{0%,100%{box-shadow:0 0 20px rgba(245,200,66,.12)}50%{box-shadow:0 0 35px rgba(245,200,66,.3)}}
.order-card::before{
  content:'';position:absolute;top:0;right:0;width:3px;height:100%;
}
.order-card.mawled::before{background:var(--gold)}
.order-card.kahk::before{background:#d97706}
.order-card.choco::before{background:#7c3aed}

/* card header */
.oc-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.oc-type-badge{
  font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;
  white-space:nowrap;letter-spacing:.05em;
}
.oc-type-badge.mawled{background:rgba(245,200,66,.15);color:var(--gold)}
.oc-type-badge.kahk{background:rgba(217,119,6,.15);color:#d97706}
.oc-type-badge.choco{background:rgba(124,58,237,.15);color:#a78bfa}
.oc-id{font-size:11px;color:var(--text-faint);font-weight:700;direction:ltr}
.oc-time{font-size:10px;color:var(--text-faint);margin-top:2px}

/* customer */
.oc-cust{
  background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:10px;
}
.oc-cust-name{font-weight:800;font-size:14px;margin-bottom:4px}
.oc-cust-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);margin-top:3px}
.oc-cust-row a{color:var(--green);text-decoration:none;font-weight:700}

/* delivery badge */
.oc-delivery-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-top:4px;
}
.oc-delivery-badge.delivery{background:rgba(59,130,246,.15);color:#60a5fa}
.oc-delivery-badge.pickup{background:rgba(34,197,94,.12);color:#4ade80}

/* items */
.oc-items{margin-bottom:10px}
.oc-item-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);
}
.oc-item-row:last-child{border:none}
.oc-item-name{color:var(--text-dim);flex:1}
.oc-item-qty{font-weight:800;color:var(--text);margin:0 8px;white-space:nowrap}
.oc-item-price{color:var(--gold);font-weight:700;white-space:nowrap}

/* totals */
.oc-total{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(245,200,66,.07);border-radius:8px;padding:8px 10px;margin-bottom:10px;
}
.oc-total-lbl{font-size:12px;color:var(--text-dim);font-weight:700}
.oc-total-val{font-size:1.1rem;font-weight:900;color:var(--gold)}

/* notes */
.oc-notes{
  font-size:11px;color:var(--text-dim);background:rgba(255,255,255,.03);
  border-radius:8px;padding:7px 10px;margin-bottom:10px;
  border-right:2px solid rgba(255,255,255,.1);
}

/* actions */
.oc-actions{display:flex;gap:8px}
.oc-btn{
  flex:1;padding:9px;border:none;border-radius:10px;font-weight:800;font-size:12px;
  cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.oc-btn-wa{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.oc-btn-wa:hover{background:rgba(34,197,94,.25)}
.oc-btn-done{background:rgba(245,200,66,.15);color:var(--gold);border:1px solid rgba(245,200,66,.25)}
.oc-btn-done:hover{background:rgba(245,200,66,.25)}
.oc-btn-del{
  width:36px;height:36px;flex:none;padding:0;
  background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);
}
.oc-btn-del:hover{background:rgba(239,68,68,.2)}

/* NEW badge */
.new-badge{
  position:absolute;top:10px;left:10px;
  background:var(--gold);color:#000;font-size:9px;font-weight:900;
  padding:2px 7px;border-radius:20px;letter-spacing:.08em;
  animation:fadeBadge 3s ease forwards;
}
@keyframes fadeBadge{0%,60%{opacity:1}100%{opacity:0}}

/* ══ TYPE TABS ══ */
.type-tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:0 14px 10px;
}
.type-tab{
  position:relative;padding:12px 8px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-dim);font-family:'Cairo',sans-serif;font-weight:800;font-size:12.5px;
  cursor:pointer;transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.type-tab.active{
  background:rgba(255,255,255,.08);border-color:var(--border-hi);color:var(--text);
}
.type-tab.tt-mawled.active{background:#1a3a5c;border-color:#2f6fb0;color:#fff}
.type-tab.tt-kahk.active{background:#c2660a;border-color:#e8850f;color:#000}
.type-tab.tt-choco.active{background:#3d2415;border-color:#6b4025;color:#fff}
.tt-label{white-space:nowrap}
.tt-badge{
  min-width:20px;height:20px;padding:0 6px;border-radius:20px;
  background:var(--red);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  animation:badgePulse 1.2s ease infinite;
}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ══ THEMED ORDER CARDS BY TYPE ══ */
.order-card.mawled{background:#12294a;border-color:#2f6fb0}
.order-card.mawled .oc-cust-name,
.order-card.mawled .oc-id,
.order-card.mawled .oc-time,
.order-card.mawled .oc-item-name,
.order-card.mawled .oc-cust-row{color:#fff!important}
.order-card.mawled .oc-cust-name{font-weight:900}
.order-card.mawled .oc-cust{background:rgba(255,255,255,.08)}

.order-card.kahk{background:#c2660a;border-color:#e8850f}
.order-card.kahk .oc-cust-name,
.order-card.kahk .oc-id,
.order-card.kahk .oc-time,
.order-card.kahk .oc-item-name,
.order-card.kahk .oc-cust-row{color:#000!important}
.order-card.kahk .oc-cust-name{font-weight:900}
.order-card.kahk .oc-cust{background:rgba(0,0,0,.1)}
.order-card.kahk .oc-item-row{border-color:rgba(0,0,0,.15)}
.order-card.kahk .oc-notes{color:#1a1a1a;background:rgba(0,0,0,.08)}

.order-card.choco{background:#3d2415;border-color:#6b4025}
.order-card.choco .oc-cust-name,
.order-card.choco .oc-id,
.order-card.choco .oc-time,
.order-card.choco .oc-item-name,
.order-card.choco .oc-cust-row{color:#fff!important}
.order-card.choco .oc-cust-name{font-weight:900}
.order-card.choco .oc-cust{background:rgba(255,255,255,.08)}

/* type ribbon on themed cards */
.oc-type-ribbon{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:8px;font-size:11px;font-weight:900;
  letter-spacing:.03em;margin-bottom:6px;
}
.oc-type-ribbon.mawled{background:rgba(255,255,255,.15);color:#fff}
.oc-type-ribbon.kahk{background:rgba(0,0,0,.18);color:#000}
.oc-type-ribbon.choco{background:rgba(255,255,255,.15);color:#fff}

/* ══ NEW ORDER ENTRANCE ANIMATION ══ */
@keyframes newOrderDrop{
  0%{opacity:0;transform:translateY(-40px) scale(.9)}
  60%{opacity:1;transform:translateY(6px) scale(1.02)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.order-card.brand-new{
  animation:newOrderDrop .5s cubic-bezier(.34,1.56,.64,1), newOrderGlow 2.2s ease 4;
}
@keyframes newOrderGlow{
  0%,100%{box-shadow:0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:0 0 30px rgba(245,200,66,.5)}
}

/* ══ GO TO ORDER LINK ══ */
.oc-goto{
  display:block;text-align:center;margin-top:8px;padding:8px;
  border-radius:10px;border:1px dashed rgba(255,255,255,.25);
  color:inherit;text-decoration:none;font-size:11.5px;font-weight:700;
  opacity:.85;transition:opacity .2s,background .2s;
}
.oc-goto:hover{opacity:1;background:rgba(255,255,255,.08)}


/* ══ DELIVERED ORDER — dimmed state ══ */
.order-card.delivered{
  opacity:.45;filter:grayscale(.35);
  transition:opacity .3s,filter .3s;
}
.order-card.delivered:hover{opacity:.7;filter:grayscale(.1)}
.delivered-banner{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(245,200,66,.15);border:1px solid rgba(245,200,66,.3);
  border-radius:10px;padding:8px;margin-bottom:10px;
  color:var(--gold);font-weight:900;font-size:12.5px;
}

.empty-state{
  text-align:center;padding:80px 24px;
  grid-column:1/-1;
}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:.3}
.empty-title{font-size:1.2rem;font-weight:800;color:var(--text-dim);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--text-faint)}

/* ══ TOAST ══ */
#cashier-toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(15,12,26,.97);border:1px solid var(--border-hi);
  border-radius:12px;padding:12px 20px;font-size:13px;font-weight:700;
  z-index:999;white-space:nowrap;transition:opacity .3s;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#cashier-toast.hide{opacity:0}

/* ══ NEW ORDER ALERT ══ */
#order-alert{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#1a1200,#0f0c00);
  border:1px solid rgba(245,200,66,.5);border-radius:14px;
  padding:14px 20px;z-index:200;
  box-shadow:0 8px 40px rgba(245,200,66,.2);
  display:none;align-items:center;gap:12px;min-width:260px;
  animation:alertIn .3s ease;
}
@keyframes alertIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#order-alert.show{display:flex;cursor:pointer}
.alert-icon{font-size:28px;animation:alertBounce .5s ease infinite alternate}
@keyframes alertBounce{from{transform:scale(1)}to{transform:scale(1.15)}}
.alert-txt{flex:1}
.alert-title{font-weight:900;font-size:14px;color:var(--gold)}
.alert-sub{font-size:12px;color:var(--text-dim);margin-top:2px}
.alert-close{font-size:18px;cursor:pointer;color:var(--text-faint);padding:4px}
.alert-close:hover{color:var(--text)}

/* ══ LOGIN GATE ══ */
#login-gate{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:none;align-items:center;justify-content:center;padding:24px;
}
#login-gate.show{display:flex}
#login-gate.hidden{display:none}
.lg-box{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:36px 28px;width:100%;max-width:360px;text-align:center;
}
.lg-icon{font-size:48px;margin-bottom:12px}
.lg-title{font-size:1.3rem;font-weight:900;margin-bottom:6px}
.lg-sub{font-size:12px;color:var(--text-dim);margin-bottom:24px}
.lg-inp{
  width:100%;padding:13px 16px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--border-hi);
  color:#fff;font-size:15px;font-family:'Cairo',sans-serif;
  margin-bottom:10px;outline:none;transition:border .2s;direction:rtl;
}
.lg-inp:focus{border-color:rgba(245,200,66,.5)}
.lg-inp::placeholder{color:var(--text-faint)}
.lg-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),#e8a020);
  color:#000;font-weight:900;font-size:15px;cursor:pointer;
  font-family:'Cairo',sans-serif;margin-top:4px;
}
.lg-err{color:#f87171;font-size:12px;min-height:18px;margin-top:8px}

/* ══ RESPONSIVE ══ */
@media(max-width:480px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .stat-val{font-size:1.25rem}
  .orders-grid{grid-template-columns:1fr}
  .topbar{padding:0 12px}
  .tb-logo{font-size:13px}
}
@media(min-width:900px){
  .stats-bar{grid-template-columns:repeat(4,1fr);padding:0 20px 16px}
  .orders-wrap{padding:0 20px}
  .filters{padding:0 20px 16px}
}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}


/* status buttons */
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.st-btn{
  padding:5px 10px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text-faint);font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;white-space:nowrap;
}
.st-btn.active-pending  {background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.4); color:#f87171}
.st-btn.active-received {background:rgba(59,130,246,.15); border-color:rgba(59,130,246,.4); color:#60a5fa}
.st-btn.active-preparing{background:rgba(251,146,60,.15); border-color:rgba(251,146,60,.4); color:#fb923c}
.st-btn.active-ready    {background:rgba(34,197,94,.15);  border-color:rgba(34,197,94,.4);  color:#4ade80}
.st-btn.active-delivery {background:rgba(168,85,247,.15); border-color:rgba(168,85,247,.4); color:#c084fc}
.st-btn.active-delivered{background:rgba(245,200,66,.18); border-color:rgba(245,200,66,.5); color:var(--gold)}
.st-btn-past{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.st-btn-past:hover{opacity:.3}

/* ── تأثير خفيف على الكارت نفسه بس لما حالته تتغير ── */
@keyframes cardFlash{
  0%{box-shadow:0 0 0 rgba(245,200,66,0)}
  30%{box-shadow:0 0 24px rgba(245,200,66,.45)}
  100%{box-shadow:0 0 0 rgba(245,200,66,0)}
}
.card-flash{animation:cardFlash .9s ease}

/* ══ PRINT ══ */
@media print{.topbar,.tb-actions,.oc-btn-del,.oc-btn-done{display:none!important}}
</style>
</head>
<body>

<!-- ══ BOOT LOADING (شاشة محايدة أثناء التحقق) ══ -->
<div id="boot-loading" style="position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
  <div style="width:38px;height:38px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--gold);border-radius:50%;animation:bootSpin .8s linear infinite"></div>
  <div style="color:var(--text-dim);font-size:13px;font-family:'Cairo',sans-serif">جاري التحقق...</div>
</div>
<style>@keyframes bootSpin{to{transform:rotate(360deg)}}</style>

<!-- ══ LOGIN GATE ══ -->
<div id="login-gate">
  <div class="lg-box">
    <div class="lg-icon">👨‍🍳</div>
    <div class="lg-title">دخول الكاشير</div>
    <div class="lg-sub">ZAMZAM DESSERT — CASHIER</div>

    <button class="filter-btn status-filter-btn" data-status="delivery" onclick="CA.setStatusFilter('delivery')">🛵 في الطريق</button>

  </div>

  <div class="orders-wrap">
    <div class="orders-header">
      <div class="orders-title">الطلبات الواردة</div>

    </div>
    <div class="orders-grid" id="orders-grid">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">لا توجد طلبات بعد</div>

<div id="cashier-toast" class="hide"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
/* ════════════════════════════════════════════════════════
   ZAMZAM CASHIER SYSTEM
   Firebase: mawled/orders, kahk/orders, choco/orders
   Auth: landing/cashiers/{id} — username + pinHash (SHA-256)
════════════════════════════════════════════════════════ */

const FB_CFG = {
  apiKey:            "AIzaSyBpZwrt4wHgWKz_dC1nBhqJ6OzypySYKNQ",
  authDomain:        "zamzam-landing.firebaseapp.com",
  databaseURL:       "https://zamzam-landing-default-rtdb.firebaseio.com",
  projectId:         "zamzam-landing",
  storageBucket:     "zamzam-landing.firebasestorage.app",
  messagingSenderId: "192876961013",
  appId:             "1:192876961013:web:8fd0f7a5d6f1db4a9e79bc"
};

const CA = {
  db:           null,
  soundOn:      true,
  filter:       'all',
  orders:       {},       /* { id: {..order, _type:'mawled'|'kahk'|'choco'} } */
  listeners:    [],
  _audioCtx:    null,
  _alertTimer:  null,
  _seenIds:     new Set(),

  /* ── SHA-256 ── */
  sha256: async function(str) {
    var buf  = new TextEncoder().encode(str);
    var hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  },

  /* ── LOGIN ── */
  login: async function() {
    var username = (document.getElementById('lg-username').value || '').trim().toLowerCase();
    var pin      = (document.getElementById('lg-pin').value || '').trim();
    var errEl    = document.getElementById('lg-err');
    if (!username) { errEl.textContent = 'أدخل اسم المستخدم'; return; }
    if (!pin)      { errEl.textContent = 'أدخل الـ PIN';       return; }
    errEl.textContent = '...جاري التحقق';

    /* init Firebase first */
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    CA.db = firebase.database();

    firebase.auth().signInAnonymously().then(async function() {
      var pinHash = await CA.sha256(pin);
      CA.db.ref('landing/cashiers').orderByChild('username').equalTo(username).once('value')
        .then(function(snap) {
          if (!snap.exists()) { errEl.textContent = 'اسم المستخدم أو الـ PIN غلط'; return; }
          var found = false, cashierId = null;
          snap.forEach(function(ch) {
            var d = ch.val();
            if (d.pinHash === pinHash && d.active !== false) {
              found = true; cashierId = ch.key;
              localStorage.setItem('zz_cashier_id', ch.key);
              localStorage.setItem('zz_cashier_name', d.username);
            }
          });
          if (found) {
            document.getElementById('login-gate').classList.remove('show');
            CA.init(localStorage.getItem('zz_cashier_name'));
          } else {
            errEl.textContent = 'اسم المستخدم أو الـ PIN غلط';
          }
        }).catch(function(e) { errEl.textContent = e.message; });
    }).catch(function(e) { errEl.textContent = e.message; });
  },

  /* ── CHECK SESSION ── */
  checkSession: function() {
    var id   = localStorage.getItem('zz_cashier_id');
    var name = localStorage.getItem('zz_cashier_name');
    var boot = document.getElementById('boot-loading');
    if (!id || !name) {
      /* مفيش جلسة خالص — اظهر فورم الدخول فوراً */
      if (boot) boot.style.display = 'none';
      var gate = document.getElementById('login-gate');
      if (gate) gate.classList.add('show');
      return false;
    }
    /* فيه جلسة محفوظة — خلي شاشة التحقق المحايدة شغالة لحد ما نتأكد */
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    CA.db = firebase.database();
    firebase.auth().signInAnonymously().then(function() {
      /* تحقق إن الكاشير لسه active */
      CA.db.ref('landing/cashiers/' + id + '/active').once('value').then(function(snap) {
        if (boot) boot.style.display = 'none';
        if (snap.val() === false) {
          CA.logout();
          return;
        }
        CA.init(name);
      }).catch(function() {
        if (boot) boot.style.display = 'none';
        var gate3 = document.getElementById('login-gate');
        if (gate3) gate3.classList.add('show');
      });
    }).catch(function() {
      /* لو Firebase فشل — اتابع بالجلسة المحفوظة بدون تحقق إضافي */
      if (boot) boot.style.display = 'none';
      CA.init(name);
    });
    return true;
  },

  /* ── INIT ── */
  init: function(cashierName) {
    /* اسم الكاشير */
    var el = document.getElementById('tb-cashier-name');
    if (el) el.textContent = cashierName || '—';

    /* صوت */
    CA.soundOn = localStorage.getItem('zz_cashier_sound') !== 'off';
    CA._updateSoundBtn();

    /* subscribe للطلبات */
    CA._subscribeOrders('mawled');
    CA._subscribeOrders('kahk');
    CA._subscribeOrders('choco');

    /* Enter key في login */
    document.getElementById('lg-pin') && document.getElementById('lg-pin').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') CA.login();
    });
  },

  /* ── SUBSCRIBE ── */
  _subscribeOrders: function(type) {
    if (!CA.db) return;
    var ref = CA.db.ref(type + '/orders').orderByChild('createdAt').limitToLast(50);

    /* الخطوة 1: حمّل الطلبات الموجودة بصمت (من غير تنبيه) */
    ref.once('value').then(function(snap) {
      snap.forEach(function(ch) {
        var order = Object.assign({ id: ch.key, _type: type }, ch.val());
        CA._seenIds.add(ch.key);
        CA.orders[ch.key] = order;
      });
      CA._render();

      /* الخطوة 2: من دلوقتي — أي طلب جديد فعلي يتعامل كـ new */
      ref.on('child_added', function(snap2) {
        var order = Object.assign({ id: snap2.key, _type: type }, snap2.val());
        CA.orders[snap2.key] = order;
        if (!CA._seenIds.has(snap2.key)) {
          CA._seenIds.add(snap2.key);
          CA._justArrivedId = snap2.key;
          CA._unseenByType[type] = (CA._unseenByType[type] || 0) + 1;
          CA._onNewOrder(order);
        }
        CA._render();
      });
    });

    ref.on('child_removed', function(snap) {
      delete CA.orders[snap.key];
      CA._render();
    });

    ref.on('child_changed', function(snap) {
      var order = Object.assign({ id: snap.key, _type: type }, snap.val());
      CA.orders[snap.key] = order;
      CA._updateCardInPlace(order);
    });
  },

  /* ── NEW ORDER ── */
  _onNewOrder: function(order) {
    if (CA.soundOn) CA._playAlert();
    CA._showAlert(order);
  },

  /* ── SOUND ── */
  _playAlert: function() {
    try {
      if (!CA._audioCtx) CA._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = CA._audioCtx;
      /* نغمة تنبيه بسيطة وواضحة */
      function beep(freq, start, dur, vol) {
        var osc  = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(vol || 0.4, ctx.currentTime + start + 0.01);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.01);
      }
      beep(880, 0,    0.12, 0.4);
      beep(880, 0.15, 0.12, 0.4);
      beep(1100,0.32, 0.22, 0.5);
    } catch(e) {}
  },

  toggleSound: function() {
    CA.soundOn = !CA.soundOn;
    localStorage.setItem('zz_cashier_sound', CA.soundOn ? 'on' : 'off');
    CA._updateSoundBtn();
    CA.toast(CA.soundOn ? '🔔 الصوت شغّال' : '🔕 الصوت متوقف');
    /* تجربة الصوت لما يشغله */
    if (CA.soundOn) CA._playAlert();
  },

  _updateSoundBtn: function() {
    var btn = document.getElementById('sound-btn');
    if (!btn) return;
    if (CA.soundOn) { btn.classList.add('on'); btn.textContent = '🔔'; }
    else            { btn.classList.remove('on'); btn.textContent = '🔕'; }
  },

  /* ── ALERT BANNER ── */
  _showAlert: function(order) {
    var labels = { mawled:'🎉 حلويات المولد', kahk:'🍪 كحك العيد', choco:'🍫 شيكولاتة العيد' };
    var el = document.getElementById('order-alert');
    document.getElementById('alert-title').textContent = 'طلب جديد! ' + (labels[order._type]||'');
    document.getElementById('alert-sub').textContent   = (order.name||'عميل') + ' — ' + (order.orderType==='delivery'?'ديليفري':'استلام');
    el.classList.add('show');
    el.onclick = function(e) {
      if (e.target.classList.contains('alert-close')) return;
      CA.jumpToOrder(order.id, order._type);
    };
    clearTimeout(CA._alertTimer);
    CA._alertTimer = setTimeout(function() { el.classList.remove('show'); }, 6000);
  },

  /* ── القفز لطلب معين (من التنبيه) ── */
  jumpToOrder: function(id, type) {
    CA.closeAlert();
    CA.setFilter(type);
    setTimeout(function() {
      var el = document.getElementById('card-' + id);
      if (el) {
        el.scrollIntoView({ behavior:'smooth', block:'center' });
        el.classList.add('brand-new');
        setTimeout(function(){ el.classList.remove('brand-new'); }, 2500);
      }
    }, 150);
  },


  closeAlert: function() {
    document.getElementById('order-alert').classList.remove('show');
  },

  /* ── FILTER ── */
  deliveryFilter: 'all',

  setFilter: function(f) {
    CA.filter = f;
    ['all','mawled','kahk','choco'].forEach(function(k) {
      var btn = document.getElementById('f-' + k);
      if (btn) btn.classList.toggle('active', k === f);
    });
    /* فتح التاب يعتبر مشاهدة — نصفّر عداد الجديد بتاعه */
    if (f !== 'all') CA._unseenByType[f] = 0;
    else Object.keys(CA._unseenByType).forEach(function(k){ CA._unseenByType[k] = 0; });
    CA._render();
  },

  setDeliveryFilter: function(f) {
    CA.deliveryFilter = f;
    ['all','delivery','pickup'].forEach(function(k) {
      var btn = document.getElementById('fd-' + k);
      if (btn) btn.classList.toggle('active', k === f);
    });
    CA._render();
  },

  /* ── فلتر الحالة (المرحلة) ── */
  statusFilter: 'all',
  setStatusFilter: function(f) {
    CA.statusFilter = f;
    document.querySelectorAll('.status-filter-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-status') === f);
    });
    CA._render();
  },

  /* ── البحث بالاسم أو رقم التليفون ── */
  searchQuery: '',
  onSearchInput: function(val) {
    CA.searchQuery = val || '';
    CA._render();
  },

  /* ── هل الطلب مطابق للفلاتر الحالية؟ (تاب النوع + توصيل/استلام + الحالة + البحث) ── */
  _orderMatchesCurrentFilters: function(o) {
    if (CA.filter !== 'all' && o._type !== CA.filter) return false;
    if (CA.deliveryFilter === 'delivery' && o.orderType !== 'delivery') return false;
    if (CA.deliveryFilter === 'pickup'   && o.orderType === 'delivery') return false;
    if (CA.statusFilter && CA.statusFilter !== 'all') {
      var st = o.status || 'pending';
      if (st !== CA.statusFilter) return false;
    }
    if (CA.searchQuery) {
      var q = CA.searchQuery.trim().toLowerCase();
      if (q) {
        var nameMatch  = (o.name || '').toLowerCase().indexOf(q) !== -1;
        var qDigits    = q.replace(/\D/g, '');
        var phoneMatch = qDigits && (
          (o.phone     || '').replace(/\D/g,'').indexOf(qDigits) !== -1 ||
          (o.whatsapp  || '').replace(/\D/g,'').indexOf(qDigits) !== -1
        );
        if (!nameMatch && !phoneMatch) return false;
      }
    }
    return true;
  },

  _filteredOrders: function() {
    var all = Object.values(CA.orders).filter(CA._orderMatchesCurrentFilters);
    all.sort(function(a, b) {
      /* الطلبات المُسلَّمة تنزل لآخر القائمة دايماً */
      var aDone = a.status === 'delivered';
      var bDone = b.status === 'delivered';
      if (aDone !== bDone) return aDone ? 1 : -1;
      return (b.createdAt||0) - (a.createdAt||0);
    });
    return all;
  },

  /* عدد الطلبات الجديدة لسه ملحوظتش لكل نوع */
  _unseenByType: { mawled:0, kahk:0, choco:0 },

  /* ── تحديث الإحصائيات والـ badges بس (من غير لمس الشبكة) ── */
  _updateStatsOnly: function() {
    var allOrds = Object.values(CA.orders);
    var totalRev = allOrds.reduce(function(s,o){ return s + (parseFloat(o.grandTotal)||parseFloat(o.total)||0); }, 0);
    var newOrds  = allOrds.filter(function(o){ return CA._isNew(o); }).length;
    var deliv    = allOrds.filter(function(o){ return o.orderType==='delivery'; }).length;
    document.getElementById('stat-total').textContent   = allOrds.length;
    document.getElementById('stat-new').textContent     = newOrds;
    document.getElementById('stat-revenue').textContent = Math.round(totalRev);
    document.getElementById('stat-delivery').textContent= deliv;
    var orders = CA._filteredOrders();
    document.getElementById('orders-count').textContent = orders.length + ' طلب';

    ['mawled','kahk','choco'].forEach(function(t) {
      var badge = document.getElementById('badge-' + t);
      var count = CA._unseenByType[t] || 0;
      if (badge) {
        if (count > 0) { badge.style.display = 'flex'; badge.textContent = count; }
        else badge.style.display = 'none';
      }
    });
    var totalUnseen = Object.values(CA._unseenByType).reduce(function(a,b){return a+b;}, 0);
    var allBadge = document.getElementById('badge-all');
    if (allBadge) {
      if (totalUnseen > 0) { allBadge.style.display='flex'; allBadge.textContent = totalUnseen; }
      else allBadge.style.display = 'none';
    }
  },

  _checkEmptyState: function() {
    var grid = document.getElementById('orders-grid');
    if (grid && !grid.children.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">لا توجد طلبات</div><div class="empty-sub">جرّب فلتر تاني أو امسح البحث</div></div>';
    }
  },

  /* ── تحديث كارت واحد بس في مكانه — بدون إعادة رسم الشبكة كلها ── */
  _updateCardInPlace: function(order) {
    CA._updateStatsOnly();
    var el = document.getElementById('card-' + order.id);
    var matches = CA._orderMatchesCurrentFilters(order);
    if (!matches) {
      if (el) {
        el.style.transition = 'opacity .25s ease, transform .25s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(.95)';
        setTimeout(function(){ if (el.parentNode) el.remove(); CA._checkEmptyState(); }, 260);
      }
      return;
    }
    if (el) {
      var wrapper = document.createElement('div');
      wrapper.innerHTML = CA._cardHTML(order);
      var newEl = wrapper.firstElementChild;
      newEl.classList.add('card-flash');
      el.replaceWith(newEl);
      setTimeout(function(){ newEl.classList.remove('card-flash'); }, 900);
    } else {
      /* الكارت مش ظاهر دلوقتي (فلتر مختلف أو لسه هيتحمل) — رندر كامل أبسط وأأمن */
      CA._render();
    }
  },

  /* ── RENDER ── */
  _render: function() {
    var orders  = CA._filteredOrders();
    var grid    = document.getElementById('orders-grid');

    CA._updateStatsOnly();

    if (!orders.length) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">لا توجد طلبات</div><div class="empty-sub">الطلبات هتظهر هنا فور وصولها</div></div>';
      return;
    }

    grid.innerHTML = orders.map(function(o) { return CA._cardHTML(o); }).join('');

    /* شغّل انيميشن الدخول على الطلب الجديد فقط */
    if (CA._justArrivedId) {
      var el = document.getElementById('card-' + CA._justArrivedId);
      if (el) el.classList.add('brand-new');
      CA._justArrivedId = null;
    }
  },

  _isNew: function(o) {
    var age = Date.now() - (o.createdAt || 0);
    return age < 10 * 60 * 1000; /* أحدث من 10 دقايق */
  },

  _cardHTML: function(o) {
    var typeLabel = { mawled:'🎉 المولد', kahk:'🍪 الكحك', choco:'🍫 شيكولاتة' }[o._type] || o._type;
    var isNew     = CA._isNew(o);
    var time      = o.createdAt ? new Date(o.createdAt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : '—';
    var date      = o.createdAt ? new Date(o.createdAt).toLocaleDateString('ar-EG') : '';
    var waNum     = CA._normalizeEgPhone(o.whatsapp || o.phone);

    /* items */
    var items     = o.items || [];
    var itemsHTML = '';
    if (items.length) {
      itemsHTML = items.map(function(it) {
        var ptL = { piece:'قطعة', kilo:'كيلو', plate:'طبق', قطعة:'قطعة', كيلو:'كيلو', طبق:'طبق' };
        var typeStr = ptL[it.priceType] || it.priceType || '';
        var total   = (parseFloat(it.price)||0) * (parseInt(it.qty)||1);
        return '<div class="oc-item-row">'
          + '<span class="oc-item-name">' + (it.name||'') + (typeStr?' ('+typeStr+')':'') + '</span>'
          + '<span class="oc-item-qty">×' + (it.qty||1) + '</span>'
          + '<span class="oc-item-price">' + total + ' ج</span>'
          + '</div>';
      }).join('');
    }

    /* totals */
    var grandTotal = parseFloat(o.grandTotal) || parseFloat(o.total) || 0;
    var delivFee   = parseFloat(o.deliveryFee) || 0;

    /* address */
    var addressHTML = '';
    if (o.orderType === 'delivery' && o.address) {
      addressHTML = '<div class="oc-cust-row">📍 ' + (o.zone ? o.zone + ' — ' : '') + o.address + '</div>';
    }

    /* notes */
    var notesHTML = o.notes
      ? '<div class="oc-notes">💬 ' + o.notes + '</div>'
      : '';

    var newBadge = isNew ? '<div class="new-badge">جديد</div>' : '';

    var typeRibbon = '<div class="oc-type-ribbon ' + o._type + '">' + typeLabel + '</div>';

    var isDelivered = (o.status === 'delivered');
    var deliveredBanner = isDelivered
      ? '<div class="delivered-banner">🎉 تم تسليم الأوردر</div>'
      : '';

    return '<div class="order-card ' + o._type + (isNew&&!isDelivered?' new-order':'') + (isDelivered?' delivered':'') + '" id="card-' + o.id + '">'
      + (isDelivered ? '' : newBadge)
      + '<div class="oc-head">'
      +   '<div>'
      +     typeRibbon
      +     '<div class="oc-id">' + (o.id||'') + '</div>'
      +     '<div class="oc-time">' + time + (date?' · '+date:'') + '</div>'
      +   '</div>'
      +   '<span class="oc-delivery-badge ' + (o.orderType==='delivery'?'delivery':'pickup') + '">'
      +     (o.orderType==='delivery'?'🛵 ديليفري':'🏪 استلام') + '</span>'
      + '</div>'
      + deliveredBanner
      + '<div class="oc-cust">'
      +   '<div class="oc-cust-name">' + (o.name||'—') + '</div>'
      +   '<div class="oc-cust-row">📞 '
      +     (waNum ? '<a href="tel:+' + waNum + '">' + (o.phone||waNum) + '</a>' : (o.phone||'—'))
      +   '</div>'
      +   addressHTML
      + '</div>'
      + (itemsHTML ? '<div class="oc-items">' + itemsHTML + '</div>' : '')
      + '<div class="oc-total">'
      +   '<span class="oc-total-lbl">الإجمالي' + (delivFee>0?' (شامل توصيل '+delivFee+' ج)':'') + '</span>'
      +   '<span class="oc-total-val">' + grandTotal + ' ج</span>'
      + '</div>'
      + notesHTML
      + CA._statusBar(o)
      + '<div class="oc-actions">'
      +   (waNum ? '<button class="oc-btn oc-btn-wa" onclick="CA.openWa(\'' + waNum + '\',\'' + o.id + '\',\'' + (o.name||'').replace(/'/g,"") + '\')">💬 تواصل واتساب</button>' : '')
      +   '<button class="oc-btn oc-btn-del"  onclick="CA.deleteOrder(\'' + o.id + '\',\'' + o._type + '\')">🗑 حذف</button>'
      + '</div>'
      + '<a class="oc-goto" href="track.html?id=' + o.id + '&type=' + o._type + '&ref=cashier" target="_blank">🔗 الذهاب لصفحة الطلب</a>'
      + '</div>';
  },

  /* ── تطبيع رقم الموبايل المصري لصيغة الكود الدولي ── */
  _normalizeEgPhone: function(raw) {
    if (!raw) return '';
    var d = String(raw).replace(/\D/g, ''); /* شيل أي حاجة غير أرقام */
    if (!d) return '';
    if (d.indexOf('00') === 0) d = d.slice(2);      /* 0020... -> 20... */
    if (d.indexOf('20') === 0 && d.length === 12) return d;      /* 20xxxxxxxxxx صح بالفعل */
    if (d.charAt(0) === '0' && d.length === 11) return '20' + d.slice(1); /* 01xxxxxxxxx -> 201xxxxxxxxx */
    if (d.length === 10 && d.charAt(0) === '1') return '20' + d;         /* 1xxxxxxxxx بدون صفر */
    if (d.indexOf('20') === 0) return d; /* أي صيغة تانية تبدأ بـ 20 سيبها */
    return d;
  },

  /* ── ACTIONS ── */
  openWa: function(num, orderId, custName) {
    var msg = 'مرحباً ' + (custName || '') + ' 🌟\nبخصوص طلبك رقم ' + (orderId || '') + ' من زمزم ديزيرت';
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
  },


  /* ── STATUS BAR ── */
  _statuses: [
    { key:'pending',   icon:'⏳', label:'لم يتم الاستلام',  cls:'active-pending'   },
    { key:'received',  icon:'📥', label:'تم الاستلام',      cls:'active-received'  },
    { key:'preparing', icon:'👨\u200d🍳', label:'جاري التحضير', cls:'active-preparing' },
    { key:'ready',     icon:'✅', label:'جاهز للاستلام',    cls:'active-ready'     },
    { key:'delivery',  icon:'🛵', label:'في الطريق',        cls:'active-delivery'  },
    { key:'delivered', icon:'🎉', label:'تم التسليم',       cls:'active-delivered' },
  ],

  _statusBar: function(o) {
    var cur = o.status || 'pending';
    var curIdx = CA._statuses.findIndex(function(s){ return s.key === cur; });
    if (curIdx === -1) curIdx = 0;
    var btns = CA._statuses.map(function(s, i) {
      var isActive = (cur === s.key);
      var isPast   = i < curIdx; /* مرحلة سابقة اتخطتها — ميتنفعش نرجعلها */
      if (isPast) {
        return '<button class="st-btn st-btn-past" disabled title="مرحلة سابقة — ما ينفعش الرجوع ليها">'
          + s.icon + ' ' + s.label + '</button>';
      }
      return '<button class="st-btn' + (isActive ? ' ' + s.cls : '') + '" '
        + 'onclick="CA.setStatus(\'' + o.id + '\',\'' + o._type + '\',\'' + s.key + '\')">'
        + s.icon + ' ' + s.label + '</button>';
    }).join('');
    return '<div class="status-bar">' + btns + '</div>';
  },

  setStatus: function(id, type, status) {
    if (!CA.db) return;
    /* حماية إضافية: امنع الرجوع لمرحلة سابقة حتى لو الطلب اتنادى بطريقة مباشرة */
    var order = CA.orders[id];
    if (order) {
      var curIdx    = CA._statuses.findIndex(function(s){ return s.key === (order.status||'pending'); });
      var targetIdx = CA._statuses.findIndex(function(s){ return s.key === status; });
      if (curIdx !== -1 && targetIdx !== -1 && targetIdx < curIdx) {
        CA.toast('⚠️ ما ينفعش ترجع لمرحلة سابقة');
        return;
      }
    }
    var lbl = CA._statuses.find(function(s){ return s.key===status; });
    /* الـ render بيحصل تلقائي من مستمع child_changed — منعمل رندر يدوي تاني عشان منلاجش */
    CA.db.ref(type + '/orders/' + id + '/status').set(status).then(function() {
      CA.toast((lbl ? lbl.icon + ' ' : '') + (lbl ? lbl.label : status));
    }).catch(function(e) { alert('❌ ' + e.message); });
  },

  deleteOrder: function(id, type) {
    if (!confirm('حذف الطلب نهائياً من Firebase؟')) return;
    if (CA.db) CA.db.ref(type + '/orders/' + id).remove();
    /* الحذف من الشاشة بيحصل تلقائي من مستمع child_removed */
    CA.toast('🗑 تم حذف الطلب');
  },

  /* ── TOAST ── */
  toast: function(msg, dur) {
    var el = document.getElementById('cashier-toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hide');
    clearTimeout(CA._toastTimer);
    CA._toastTimer = setTimeout(function() { el.classList.add('hide'); }, dur || 2500);
  },

  /* ── LOGOUT ── */
  logout: function() {
    localStorage.removeItem('zz_cashier_id');
    localStorage.removeItem('zz_cashier_name');
    /* شيل الـ listeners */
    if (CA.db) {
      ['mawled','kahk','choco'].forEach(function(t) {
        CA.db.ref(t + '/orders').off();
      });
    }
    window.location.href = 'index.html';
  }
};

/* ════ BOOT ════ */
document.addEventListener('DOMContentLoaded', function() {
  /* لو فيه session — ادخل مباشرة */
  if (!CA.checkSession()) {
    /* اظهر login */
    setTimeout(function() {
      var u = document.getElementById('lg-username');
      if (u) u.focus();
    }, 200);
  }

  /* Enter في PIN */
  var pinInp = document.getElementById('lg-pin');
  if (pinInp) pinInp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') CA.login();
  });

  /* unlock AudioContext بأول لمسة — مهم جداً للموبايل */
  document.addEventListener('touchstart', function() {
    if (!CA._audioCtx) {
      CA._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (CA._audioCtx.state === 'suspended') {
      CA._audioCtx.resume();
    }
  }, { once: false });

  document.addEventListener('click', function() {
    if (!CA._audioCtx) {
      CA._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (CA._audioCtx.state === 'suspended') {
      CA._audioCtx.resume();
    }
  }, { once: false });
});
</script>
